openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Kindred Coach API
servers:
  - url: /api
    description: Base API path
tags:
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: health
    description: Health operations
  - name: morning
    description: Morning baseline logs
  - name: scans
    description: Interval body scans
  - name: evening
    description: Evening reports
  - name: habits
    description: Goals and habit tracking
  - name: dashboard
    description: Dashboard summaries

paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      security:
        - sessionCookie: []
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      security: []
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      security: []
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /morning-logs:
    get:
      operationId: listMorningLogs
      tags: [morning]
      summary: List morning baseline logs
      responses:
        "200":
          description: List of morning logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MorningLog"
    post:
      operationId: createMorningLog
      tags: [morning]
      summary: Create a morning baseline log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MorningLogInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MorningLog"

  /morning-logs/{id}:
    get:
      operationId: getMorningLog
      tags: [morning]
      summary: Get a morning log by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Morning log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MorningLog"
        "404":
          description: Not found

  /body-scans:
    get:
      operationId: listBodyScans
      tags: [scans]
      summary: List body scans
      responses:
        "200":
          description: List of body scans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BodyScan"
    post:
      operationId: createBodyScan
      tags: [scans]
      summary: Log a body scan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BodyScanInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BodyScan"

  /evening-reports:
    get:
      operationId: listEveningReports
      tags: [evening]
      summary: List evening reports
      responses:
        "200":
          description: List of evening reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EveningReport"
    post:
      operationId: createEveningReport
      tags: [evening]
      summary: Create an evening report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EveningReportInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EveningReport"

  /habits:
    get:
      operationId: listHabits
      tags: [habits]
      summary: List habits
      responses:
        "200":
          description: List of habits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Habit"
    post:
      operationId: createHabit
      tags: [habits]
      summary: Create a new habit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"

  /habits/{id}:
    patch:
      operationId: updateHabit
      tags: [habits]
      summary: Update a habit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"
        "404":
          description: Not found
    delete:
      operationId: deleteHabit
      tags: [habits]
      summary: Delete a habit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /habits/{id}/entries:
    get:
      operationId: listHabitEntries
      tags: [habits]
      summary: Get entries for a habit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of habit entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HabitEntry"
    post:
      operationId: logHabitEntry
      tags: [habits]
      summary: Log a habit entry for today
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitEntryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabitEntry"

  /dashboard/today:
    get:
      operationId: getTodaySummary
      tags: [dashboard]
      summary: Get today's progress summary
      responses:
        "200":
          description: Today's summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodaySummary"

  /dashboard/streaks:
    get:
      operationId: getStreaks
      tags: [dashboard]
      summary: Get habit streaks
      responses:
        "200":
          description: Habit streaks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HabitStreak"

  /dashboard/mood-trend:
    get:
      operationId: getMoodTrend
      tags: [dashboard]
      summary: Get mood/mental load trend for the past 7 days
      responses:
        "200":
          description: Mood trend data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MoodTrendPoint"

security:
  - sessionCookie: []
  - bearerSession: []

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sid
      description: Browser session cookie set by the /login flow.
    bearerSession:
      type: http
      scheme: bearer
      description: Opaque session token for mobile clients — `Bearer <sid>`.
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    MorningLog:
      type: object
      required: [id, date, mentalLoadLevel, miniGoals, createdAt]
      properties:
        id:
          type: integer
        date:
          type: string
        mentalLoadLevel:
          type: string
        miniGoals:
          type: array
          items:
            type: string
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    MorningLogInput:
      type: object
      required: [date, mentalLoadLevel, miniGoals]
      properties:
        date:
          type: string
        mentalLoadLevel:
          type: string
        miniGoals:
          type: array
          items:
            type: string
        notes:
          type: string

    BodyScan:
      type: object
      required: [id, scannedAt, feelings, energyLevel, createdAt]
      properties:
        id:
          type: integer
        scannedAt:
          type: string
        feelings:
          type: array
          items:
            type: string
        energyLevel:
          type: integer
        physicalSensations:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    BodyScanInput:
      type: object
      required: [feelings, energyLevel]
      properties:
        scannedAt:
          type: string
        feelings:
          type: array
          items:
            type: string
        energyLevel:
          type: integer
        physicalSensations:
          type: string
        notes:
          type: string

    EveningReport:
      type: object
      required: [id, date, medicationEffectiveness, createdAt]
      properties:
        id:
          type: integer
        date:
          type: string
        medicationEffectiveness:
          type: integer
        overallMood:
          type: ["string", "null"]
        wins:
          type: ["string", "null"]
        challenges:
          type: ["string", "null"]
        tomorrowIntent:
          type: ["string", "null"]
        createdAt:
          type: string

    EveningReportInput:
      type: object
      required: [date, medicationEffectiveness]
      properties:
        date:
          type: string
        medicationEffectiveness:
          type: integer
        overallMood:
          type: string
        wins:
          type: string
        challenges:
          type: string
        tomorrowIntent:
          type: string

    Habit:
      type: object
      required: [id, name, targetDays, startDate, completedCount, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        targetDays:
          type: integer
        startDate:
          type: string
        completedCount:
          type: integer
        createdAt:
          type: string

    HabitInput:
      type: object
      required: [name, targetDays]
      properties:
        name:
          type: string
        description:
          type: string
        targetDays:
          type: integer
        startDate:
          type: string

    HabitUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        targetDays:
          type: integer

    HabitEntry:
      type: object
      required: [id, habitId, date, completed, createdAt]
      properties:
        id:
          type: integer
        habitId:
          type: integer
        date:
          type: string
        completed:
          type: boolean
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    HabitEntryInput:
      type: object
      required: [date, completed]
      properties:
        date:
          type: string
        completed:
          type: boolean
        notes:
          type: string

    TodaySummary:
      type: object
      required: [date, morningDone, eveningDone, bodyScansCount, habitsCompletedToday, totalHabits]
      properties:
        date:
          type: string
        morningDone:
          type: boolean
        eveningDone:
          type: boolean
        bodyScansCount:
          type: integer
        habitsCompletedToday:
          type: integer
        totalHabits:
          type: integer
        currentMentalLoad:
          type: ["string", "null"]

    HabitStreak:
      type: object
      required: [habitId, habitName, currentStreak, longestStreak, completedCount, targetDays]
      properties:
        habitId:
          type: integer
        habitName:
          type: string
        currentStreak:
          type: integer
        longestStreak:
          type: integer
        completedCount:
          type: integer
        targetDays:
          type: integer

    MoodTrendPoint:
      type: object
      required: [date, mentalLoadLevel, bodyScansCount]
      properties:
        date:
          type: string
        mentalLoadLevel:
          type: ["string", "null"]
        bodyScansCount:
          type: integer
        medicationEffectiveness:
          type: ["integer", "null"]
