openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Kindred Coach API
servers:
  - url: /api
    description: Base API path
tags:
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: health
    description: Health operations
  - name: morning
    description: Morning baseline logs
  - name: scans
    description: Interval body scans
  - name: evening
    description: Evening reports
  - name: habits
    description: Goals and habit tracking
  - name: dashboard
    description: Dashboard summaries
  - name: affirmations
    description: Daily positive affirmations
  - name: calendar
    description: Google Calendar integration
  - name: profile
    description: User profile fields collected during onboarding
  - name: medications
    description: Medication schedule and intake log
  - name: chat
    description: AI coaching chat and archive

paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      security:
        - sessionCookie: []
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      security: []
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    post:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and return the OIDC logout URL
      security: []
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Session cleared. The client must navigate to the returned URL to complete OIDC logout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserLogoutResponse'
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /morning-logs:
    get:
      operationId: listMorningLogs
      tags: [morning]
      summary: List morning baseline logs
      responses:
        "200":
          description: List of morning logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MorningLog"
    post:
      operationId: createMorningLog
      tags: [morning]
      summary: Create a morning baseline log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MorningLogInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MorningLog"

  /morning-logs/{id}:
    get:
      operationId: getMorningLog
      tags: [morning]
      summary: Get a morning log by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Morning log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MorningLog"
        "404":
          description: Not found

  /body-scans:
    get:
      operationId: listBodyScans
      tags: [scans]
      summary: List body scans
      responses:
        "200":
          description: List of body scans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BodyScan"
    post:
      operationId: createBodyScan
      tags: [scans]
      summary: Log a body scan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BodyScanInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BodyScan"

  /evening-reports:
    get:
      operationId: listEveningReports
      tags: [evening]
      summary: List evening reports
      responses:
        "200":
          description: List of evening reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EveningReport"
    post:
      operationId: createEveningReport
      tags: [evening]
      summary: Create an evening report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EveningReportInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EveningReport"

  /habits:
    get:
      operationId: listHabits
      tags: [habits]
      summary: List habits
      responses:
        "200":
          description: List of habits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Habit"
    post:
      operationId: createHabit
      tags: [habits]
      summary: Create a new habit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"

  /habits/{id}:
    patch:
      operationId: updateHabit
      tags: [habits]
      summary: Update a habit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"
        "404":
          description: Not found
    delete:
      operationId: deleteHabit
      tags: [habits]
      summary: Delete a habit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /habits/{id}/entries:
    get:
      operationId: listHabitEntries
      tags: [habits]
      summary: Get entries for a habit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of habit entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HabitEntry"
    post:
      operationId: logHabitEntry
      tags: [habits]
      summary: Log a habit entry for today
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitEntryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabitEntry"

  /affirmations:
    get:
      operationId: listAffirmations
      tags: [affirmations]
      summary: List all active affirmations
      responses:
        "200":
          description: All active affirmations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Affirmation"

  /affirmations/today:
    get:
      operationId: getTodayAffirmation
      tags: [affirmations]
      summary: Get today's positive affirmation
      responses:
        "200":
          description: A single affirmation chosen for today
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Affirmation"
  /affirmations/random:
    get:
      operationId: getRandomAffirmation
      tags: [affirmations]
      summary: Get a random affirmation (used for the reshuffle button)
      responses:
        "200":
          description: A random affirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Affirmation"

  /profile:
    patch:
      operationId: updateProfile
      tags: [profile]
      summary: Update profile fields (used by onboarding flow)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateInput'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'

  /chat/active:
    get:
      operationId: getActiveChat
      tags: [chat]
      summary: Get the current active conversation with messages (creates one if missing)
      responses:
        '200':
          description: Active conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatConversationWithMessages'

  /chat/send:
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Append a user message and get the AI response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatSendInput'
      responses:
        '200':
          description: Updated conversation with both messages appended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatConversationWithMessages'

  /chat/append:
    post:
      operationId: appendChatMessage
      tags: [chat]
      summary: Append a pre-composed message without invoking the AI (used by onboarding script)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatAppendInput'
      responses:
        '200':
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatConversationWithMessages'

  /chat/archive:
    post:
      operationId: archiveActiveChat
      tags: [chat]
      summary: Archive the current active conversation and start a fresh one
      responses:
        '200':
          description: New active conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatConversationWithMessages'

  /chat/archived:
    get:
      operationId: listArchivedChats
      tags: [chat]
      summary: List the user's archived conversations
      responses:
        '200':
          description: Archived conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatConversation'

  /chat/archived/{id}:
    get:
      operationId: getArchivedChat
      tags: [chat]
      summary: Get an archived conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Archived conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatConversationWithMessages'
        '404':
          description: Not found

  /medications:
    get:
      operationId: listMedications
      tags: [medications]
      summary: List the current user's medications with today's intake status
      responses:
        '200':
          description: Medications with today flag
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MedicationWithStatus'
    post:
      operationId: createMedication
      tags: [medications]
      summary: Create a medication entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicationInput'
      responses:
        '201':
          description: Created medication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medication'

  /medications/{id}:
    patch:
      operationId: updateMedication
      tags: [medications]
      summary: Update a medication entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicationInput'
      responses:
        '200':
          description: Updated medication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medication'
        '404':
          description: Not found
    delete:
      operationId: deleteMedication
      tags: [medications]
      summary: Delete a medication entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found

  /medications/weekly-report:
    get:
      operationId: getMedicationWeeklyReport
      tags: [medications]
      summary: Raw 7-day dose data for all medications, for client-side on-time/missed/upcoming labeling
      responses:
        '200':
          description: Weekly report data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicationWeeklyReport'

  /medications/{id}/log:
    post:
      operationId: logMedicationTaken
      tags: [medications]
      summary: Mark a specific scheduled dose as taken today (idempotent); optionally rate effectiveness 1-10
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicationLogInput'
      responses:
        '201':
          description: Log entry recorded or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicationLog'
        '404':
          description: Not found
    delete:
      operationId: unlogMedicationTaken
      tags: [medications]
      summary: Remove today's taken log for a specific scheduled dose
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicationDoseRef'
      responses:
        '204':
          description: Removed
        '404':
          description: Not found

  /calendar/upcoming:
    get:
      operationId: getUpcomingCalendarEvents
      tags: [calendar]
      summary: Get upcoming Google Calendar events (today + 3 days)
      description: >
        The Google Calendar connector is project-scoped (Replit Connectors
        are tied to the app builder's Replit account, not the requesting
        user). To prevent leaking the builder's schedule to other users,
        this endpoint is gated by CALENDAR_OWNER_USER_ID and returns 403
        for any non-owner caller.
      responses:
        "200":
          description: Upcoming events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEvent"
        "403":
          description: Calendar not available for this account
        "502":
          description: Calendar provider unavailable

  /dashboard/today:
    get:
      operationId: getTodaySummary
      tags: [dashboard]
      summary: Get today's progress summary
      responses:
        "200":
          description: Today's summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodaySummary"

  /dashboard/streaks:
    get:
      operationId: getStreaks
      tags: [dashboard]
      summary: Get habit streaks
      responses:
        "200":
          description: Habit streaks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HabitStreak"

  /dashboard/mood-trend:
    get:
      operationId: getMoodTrend
      tags: [dashboard]
      summary: Get mood/mental load trend for the past 7 days
      responses:
        "200":
          description: Mood trend data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MoodTrendPoint"

security:
  - sessionCookie: []
  - bearerSession: []

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sid
      description: Browser session cookie set by the /login flow.
    bearerSession:
      type: http
      scheme: bearer
      description: Opaque session token for mobile clients — `Bearer <sid>`.
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl, preferredName, birthday, struggles, strengths, interests, bio, motivationalQuote, onboardedAt]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
        preferredName:
          type: [string, 'null']
        birthday:
          type: [string, 'null']
        struggles:
          type: [string, 'null']
        strengths:
          type: [string, 'null']
        interests:
          type: [string, 'null']
        bio:
          type: [string, 'null']
        motivationalQuote:
          type: [string, 'null']
        onboardedAt:
          type: [string, 'null']
          format: date-time
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    BrowserLogoutResponse:
      type: object
      required: [logoutUrl]
      properties:
        logoutUrl:
          type: string
          format: uri
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    MorningLog:
      type: object
      required: [id, date, mentalLoadLevel, miniGoals, createdAt]
      properties:
        id:
          type: integer
        date:
          type: string
        mentalLoadLevel:
          type: string
        miniGoals:
          type: array
          items:
            type: string
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    MorningLogInput:
      type: object
      required: [date, mentalLoadLevel, miniGoals]
      properties:
        date:
          type: string
        mentalLoadLevel:
          type: string
        miniGoals:
          type: array
          items:
            type: string
        notes:
          type: string

    BodyScan:
      type: object
      required: [id, scannedAt, feelings, energyLevel, createdAt]
      properties:
        id:
          type: integer
        scannedAt:
          type: string
        feelings:
          type: array
          items:
            type: string
        energyLevel:
          type: integer
        physicalSensations:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    BodyScanInput:
      type: object
      required: [feelings, energyLevel]
      properties:
        scannedAt:
          type: string
        feelings:
          type: array
          items:
            type: string
        energyLevel:
          type: integer
        physicalSensations:
          type: string
        notes:
          type: string

    EveningReport:
      type: object
      required: [id, date, medicationEffectiveness, createdAt]
      properties:
        id:
          type: integer
        date:
          type: string
        medicationEffectiveness:
          type: integer
        overallMood:
          type: ["string", "null"]
        wins:
          type: ["string", "null"]
        challenges:
          type: ["string", "null"]
        tomorrowIntent:
          type: ["string", "null"]
        createdAt:
          type: string

    EveningReportInput:
      type: object
      required: [date, medicationEffectiveness]
      properties:
        date:
          type: string
        medicationEffectiveness:
          type: integer
        overallMood:
          type: string
        wins:
          type: string
        challenges:
          type: string
        tomorrowIntent:
          type: string

    Habit:
      type: object
      required: [id, name, targetDays, startDate, completedCount, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        targetDays:
          type: integer
        startDate:
          type: string
        completedCount:
          type: integer
        createdAt:
          type: string

    HabitInput:
      type: object
      required: [name, targetDays]
      properties:
        name:
          type: string
        description:
          type: string
        targetDays:
          type: integer
        startDate:
          type: string

    HabitUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        targetDays:
          type: integer

    HabitEntry:
      type: object
      required: [id, habitId, date, completed, createdAt]
      properties:
        id:
          type: integer
        habitId:
          type: integer
        date:
          type: string
        completed:
          type: boolean
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    HabitEntryInput:
      type: object
      required: [date, completed]
      properties:
        date:
          type: string
        completed:
          type: boolean
        notes:
          type: string

    TodaySummary:
      type: object
      required: [date, morningDone, eveningDone, bodyScansCount, habitsCompletedToday, totalHabits]
      properties:
        date:
          type: string
        morningDone:
          type: boolean
        eveningDone:
          type: boolean
        bodyScansCount:
          type: integer
        habitsCompletedToday:
          type: integer
        totalHabits:
          type: integer
        currentMentalLoad:
          type: ["string", "null"]

    HabitStreak:
      type: object
      required: [habitId, habitName, currentStreak, longestStreak, completedCount, targetDays]
      properties:
        habitId:
          type: integer
        habitName:
          type: string
        currentStreak:
          type: integer
        longestStreak:
          type: integer
        completedCount:
          type: integer
        targetDays:
          type: integer

    ProfileUpdateInput:
      type: object
      properties:
        preferredName:
          type: [string, 'null']
          maxLength: 80
        birthday:
          type: [string, 'null']
          format: date
        struggles:
          type: [string, 'null']
          maxLength: 500
        strengths:
          type: [string, 'null']
          maxLength: 500
        interests:
          type: [string, 'null']
          maxLength: 500
        bio:
          type: [string, 'null']
          maxLength: 1000
        motivationalQuote:
          type: [string, 'null']
          maxLength: 280
        onboardedAt:
          type: [string, 'null']
          format: date-time
      additionalProperties: false

    ChatMessage:
      type: object
      required: [id, conversationId, role, content, createdAt]
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time

    ChatConversation:
      type: object
      required: [id, userId, title, status, createdAt, archivedAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        title:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        archivedAt:
          type: [string, 'null']
          format: date-time

    ChatConversationWithMessages:
      allOf:
        - $ref: '#/components/schemas/ChatConversation'
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              items:
                $ref: '#/components/schemas/ChatMessage'

    ChatSendInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4000

    ChatAppendInput:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 4000

    CalendarEvent:
      type: object
      required: [date, time, title]
      properties:
        date:
          type: string
        time:
          type: string
        title:
          type: string

    Affirmation:
      type: object
      required: [id, text, createdAt]
      properties:
        id:
          type: integer
        text:
          type: string
        createdAt:
          type: string

    Medication:
      type: object
      required: [id, name, dosage, times, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        dosage:
          type: string
        times:
          type: array
          description: One or more HH:MM 24-hour scheduled times for this medication
          minItems: 1
          items:
            type: string
            pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    MedicationInput:
      type: object
      required: [name, dosage, times]
      properties:
        name:
          type: string
          minLength: 1
        dosage:
          type: string
          minLength: 1
        times:
          type: array
          minItems: 1
          maxItems: 12
          items:
            type: string
            pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        notes:
          type: ["string", "null"]

    MedicationDoseStatus:
      type: object
      required: [scheduledTime, takenAt, effectiveness]
      properties:
        scheduledTime:
          type: string
          description: HH:MM scheduled time for this dose
        takenAt:
          type: ["string", "null"]
          description: ISO timestamp of today's intake for this dose, or null if not taken yet
        effectiveness:
          type: ["integer", "null"]
          description: 1-10 effectiveness rating for this dose today, if rated
          minimum: 1
          maximum: 10

    MedicationWithStatus:
      allOf:
        - $ref: '#/components/schemas/Medication'
        - type: object
          required: [doses, recentEffectivenessAvg, recentEffectivenessCount]
          properties:
            doses:
              type: array
              description: Today's status for each scheduled dose, in time order
              items:
                $ref: '#/components/schemas/MedicationDoseStatus'
            recentEffectivenessAvg:
              type: ["number", "null"]
              description: Average effectiveness over the last 7 days across all doses, or null if no ratings yet
            recentEffectivenessCount:
              type: integer
              description: Number of rated doses in the last 7 days

    MedicationLog:
      type: object
      required: [id, medicationId, date, scheduledTime, takenAt, effectiveness]
      properties:
        id:
          type: integer
        medicationId:
          type: integer
        date:
          type: string
        scheduledTime:
          type: string
        takenAt:
          type: string
        effectiveness:
          type: ["integer", "null"]
          minimum: 1
          maximum: 10

    MedicationDoseRef:
      type: object
      required: [scheduledTime]
      properties:
        scheduledTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: Which scheduled dose (HH:MM) to act on
      additionalProperties: false

    MedicationLogInput:
      type: object
      required: [scheduledTime]
      properties:
        scheduledTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: Which scheduled dose (HH:MM) is being marked taken
        effectiveness:
          type: ["integer", "null"]
          minimum: 1
          maximum: 10
          description: How effective this dose felt, on a 1-10 scale
      additionalProperties: false

    MedicationWeeklyReport:
      type: object
      required: [days, medications, logs]
      properties:
        days:
          type: array
          description: The 7 day-date strings (YYYY-MM-DD), oldest first, that the grid covers
          items:
            type: string
        medications:
          type: array
          items:
            type: object
            required: [id, name, dosage, times, createdDate]
            properties:
              id:
                type: integer
              name:
                type: string
              dosage:
                type: string
              times:
                type: array
                items:
                  type: string
              createdDate:
                type: string
                description: YYYY-MM-DD the medication was created; days before this are not applicable in the grid
        logs:
          type: array
          description: Every dose log in the window; client matches by medicationId + date + scheduledTime
          items:
            type: object
            required: [medicationId, date, scheduledTime, takenAt, effectiveness]
            properties:
              medicationId:
                type: integer
              date:
                type: string
              scheduledTime:
                type: string
              takenAt:
                type: string
              effectiveness:
                type: ["integer", "null"]

    MoodTrendPoint:
      type: object
      required: [date, mentalLoadLevel, bodyScansCount]
      properties:
        date:
          type: string
        mentalLoadLevel:
          type: ["string", "null"]
        bodyScansCount:
          type: integer
        medicationEffectiveness:
          type: ["integer", "null"]
