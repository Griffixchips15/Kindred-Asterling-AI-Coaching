kind = "web"
previewPath = "/"
title = "Kindred Coach"
version = "1.0.0"
id = "artifacts/kindred-coach"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23546

[services.development]
run = "pnpm --filter @workspace/kindred-coach run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kindred-coach", "run", "build" ]
publicDir = "artifacts/kindred-coach/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23546"
BASE_PATH = "/"
