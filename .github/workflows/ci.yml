name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_ENV: test
  HELCIM_PAYMENTS_ENABLED: "false"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm --filter @workspace/db run test:api

      - name: Build production artifacts
        run: pnpm run build
        env:
          MONGODB_URI: mongodb://build-placeholder:27017
          MONGODB_DATABASE: kindred_test
          PORT: 3000
          APP_PUBLIC_URL: https://beta.example.test
          SUBSCRIPTION_OWNER_IDS: ci-owner
          RESEND_API_KEY: ci-placeholder
          RESEND_FROM_EMAIL: beta@example.test
