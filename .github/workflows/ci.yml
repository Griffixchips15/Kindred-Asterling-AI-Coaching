name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_ENV: test

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: kindred_test
          POSTGRES_USER: kindred
          POSTGRES_PASSWORD: kindred
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Push DB schema
        run: pnpm --filter @workspace/db run push
        env:
          DATABASE_URL: postgres://kindred:kindred@localhost:5432/kindred_test

      - name: Run typecheck
        run: pnpm run typecheck
        env:
          DATABASE_URL: postgres://kindred:kindred@localhost:5432/kindred_test

      - name: Run tests
        run: pnpm --filter @workspace/api-server test
        env:
          DATABASE_URL: postgres://kindred:kindred@localhost:5432/kindred_test