name: Security Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        # The npm audit endpoint frequently exceeds pnpm's default 60s socket
        # timeout on this workspace's large lockfile (ERR_SOCKET_TIMEOUT x3
        # over ~4 minutes in CI). Raise the network timeout so the audit
        # endpoint can respond instead of failing the whole workflow.
        run: |
          pnpm config set network-timeout 300000
          pnpm audit --audit-level=high
