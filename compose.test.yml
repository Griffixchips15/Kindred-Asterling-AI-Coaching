services:
  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_DB: kindred_test
      POSTGRES_USER: kindred
      POSTGRES_PASSWORD: kindred
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kindred -d kindred_test"]
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data

