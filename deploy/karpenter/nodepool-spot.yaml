apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: general-spot
spec:
  # Karpenter considers this pool before the lower-weight fallback pool.
  weight: 100
  template:
    metadata:
      labels:
        workload: general
        capacity: spot
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: kindred-general
      expireAfter: 720h
      terminationGracePeriod: 5m
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
        - key: kubernetes.io/os
          operator: In
          values: [linux]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [spot]
        # "m" is AWS's general-purpose instance category. Multiple generations
        # and sizes give EC2 Fleet many Spot capacity pools in every selected AZ.
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: [m]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: [5]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: [large, xlarge, 2xlarge, 4xlarge]
  limits:
    cpu: "500"
    memory: 2000Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
    budgets:
      - nodes: "10%"
      - nodes: "0"
        schedule: "0 13 * * mon-fri"
        duration: 9h
        reasons: [Underutilized]
