apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: kindred-general
spec:
  amiFamily: Bottlerocket
  amiSelectorTerms:
    # Resolve and pin a tested release alias in production; the deploy script
    # intentionally requires this value instead of silently tracking latest.
    - alias: ${BOTTLEROCKET_AMI_ALIAS}
  role: ${KARPENTER_NODE_ROLE_NAME}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: ${CLUSTER_NAME}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: ${CLUSTER_NAME}
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 20Gi
        volumeType: gp3
        encrypted: true
        kmsKeyID: ${EBS_KMS_KEY_ARN}
        deleteOnTermination: true
  detailedMonitoring: true
  tags:
    Application: kindred
    ManagedBy: karpenter
    karpenter.sh/discovery: ${CLUSTER_NAME}
