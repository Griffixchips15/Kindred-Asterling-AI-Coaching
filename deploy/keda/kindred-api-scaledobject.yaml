apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: kindred-api-cpu
  namespace: kindred
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kindred-api
  pollingInterval: 15
  cooldownPeriod: 120
  initialCooldownPeriod: 30
  minReplicaCount: 3
  maxReplicaCount: 50
  fallback:
    failureThreshold: 3
    replicas: 6
  advanced:
    restoreToOriginalReplicaCount: false
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 30
            - type: Pods
              value: 4
              periodSeconds: 30
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 25
              periodSeconds: 60
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "65"
