# ──────────────────────────────────────────────────────────────────────────────
# Kindred Asterling AI Coaching — Validation Pipeline
#
# This pipeline validates the monorepo on every push and MR.
# Coolify handles Docker builds and deployments directly from main,
# so this pipeline is intentionally build/publish/deploy-free.
# ──────────────────────────────────────────────────────────────────────────────

stages:
  - validate
  - test
  - build

# ──────────────────────────────────────────────────────────────────────────────
# Base template shared by all Node jobs.
# Pins Node 24 and activates pnpm 10.28.1 via corepack before any script runs.
# The pnpm store is cached and keyed on the lockfile hash so it is only
# invalidated when dependencies actually change.
# ──────────────────────────────────────────────────────────────────────────────
.node-base:
  image: node:24-bookworm-slim
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.28.1 --activate
    - pnpm install --frozen-lockfile
  cache:
    # Cache key includes the lockfile so the cache is busted on dependency changes
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
    policy: pull-push
  variables:
    # Tell pnpm to use a project-local store so it lands inside the cache path
    PNPM_STORE_DIR: "$CI_PROJECT_DIR/.pnpm-store"

# ──────────────────────────────────────────────────────────────────────────────
# VALIDATE STAGE
# ──────────────────────────────────────────────────────────────────────────────

# Runs the root-level typecheck which covers all workspace packages via
# tsc --build (libs) and then each artifact/scripts package.
# allow_failure: true while frontend/app/layout.tsx has a pre-existing
# LayoutProps type error on this branch. Remove once that is fixed.
typecheck:
  extends: .node-base
  stage: validate
  allow_failure: true
  script:
    - pnpm run typecheck

# Verifies all files conform to the project's Prettier formatting rules.
# allow_failure: true while the codebase is brought into compliance —
# run `pnpm exec prettier --write .` locally and commit to fix.
# Remove allow_failure once the bulk format pass is done.
format-check:
  extends: .node-base
  stage: validate
  allow_failure: true
  script:
    - pnpm exec prettier --check .

# ──────────────────────────────────────────────────────────────────────────────
# TEST STAGE
# ──────────────────────────────────────────────────────────────────────────────

# Runs the Vitest suite for the API server (artifacts/api-server).
test-api-server:
  extends: .node-base
  stage: test
  script:
    - pnpm --filter @workspace/api-server run test

# Runs Vitest for the Kindred Coach frontend (artifacts/kindred-coach).
# allow_failure: true because the frontend package has no test script yet;
# remove this flag once tests are added.
test-kindred-coach:
  extends: .node-base
  stage: test
  allow_failure: true
  script:
    - pnpm --filter @workspace/kindred-coach run test

# ──────────────────────────────────────────────────────────────────────────────
# BUILD STAGE
# ──────────────────────────────────────────────────────────────────────────────

# Performs a local Docker build to verify the Dockerfile compiles end-to-end.
# No image is pushed — Coolify handles the real build from main.
# allow_failure: true so a slow/flaky Docker build does not block MR merges.
# Sentry tokens are intentionally omitted; they are not needed for a build check.
# VITE_CLERK_PUBLISHABLE_KEY is passed as a dummy value so the ARG is satisfied
# without exposing a real key — set a real CI variable if you need a valid build.
verify-dockerfile:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    # Dummy placeholder — satisfies the Dockerfile ARG without a real key.
    # Set VITE_CLERK_PUBLISHABLE_KEY as a masked CI/CD variable for a real build.
    VITE_CLERK_PUBLISHABLE_KEY: "pk_test_placeholder"
  allow_failure: true
  script:
    - docker build
        --build-arg VITE_CLERK_PUBLISHABLE_KEY="$VITE_CLERK_PUBLISHABLE_KEY"
        --no-cache
        --tag verify-only
        .
